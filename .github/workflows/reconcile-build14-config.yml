name: Reconcile Build 14 Config

on:
  push:
    branches:
      - beta-hardening-typecheck-20260906
    paths:
      - .github/workflows/reconcile-build14-config.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-hardening-typecheck-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reconcile Expo, EAS, dependency, and anatomy options
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          app_path = Path('app.json')
          app = json.loads(app_path.read_text())
          expo = app['expo']
          expo['runtimeVersion'] = {'policy': 'appVersion'}
          expo['updates'] = {'url': 'https://u.expo.dev/04e8415c-22c9-41b2-819f-7e4ee0d1261c'}
          app_path.write_text(json.dumps(app, indent=2) + '\n')

          eas_path = Path('eas.json')
          eas = json.loads(eas_path.read_text())
          eas['build']['development']['channel'] = 'development'
          eas['build']['preview']['channel'] = 'preview'
          eas['build']['production']['channel'] = 'production'
          eas_path.write_text(json.dumps(eas, indent=2) + '\n')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['expo-updates'] = '~57.0.21'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          quickcheck_path = Path('app/quickcheck.tsx')
          quickcheck = quickcheck_path.read_text()
          old = "const SCAN_REGIONS = ['Head', 'Brain', 'C-spine', 'T-spine', 'L-spine', 'Chest', 'Abdomen', 'Pelvis', 'Upper extremity', 'Lower extremity', 'Full body'];"
          new = "const SCAN_REGIONS = ['Head', 'Brain', 'C-spine', 'T-spine', 'L-spine', 'Chest', 'Abdomen', 'Pelvis', 'Shoulder', 'Elbow', 'Wrist / hand', 'Hip', 'Knee', 'Ankle / foot', 'Upper extremity', 'Lower extremity', 'Full body'];"
          if old not in quickcheck:
              raise SystemExit('Expected SCAN_REGIONS definition was not found; refusing to patch a different QuickCheck version.')
          quickcheck_path.write_text(quickcheck.replace(old, new, 1))
          PY
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Expo config
        run: npx expo config --type public >/dev/null
      - name: Commit reconciled files
        shell: bash
        run: |
          if git diff --quiet -- app.json eas.json package.json package-lock.json app/quickcheck.tsx; then
            echo 'No reconciliation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.json eas.json package.json package-lock.json app/quickcheck.tsx
          git commit -m 'Reconcile Build 14 Expo config and exam anatomy options'
          git push origin HEAD:beta-hardening-typecheck-20260906
