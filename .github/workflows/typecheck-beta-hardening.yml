name: Beta Hardening Checks
on:
  push:
    branches:
      - beta-hardening-typecheck-20260906
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Validate public Expo config
        run: npx expo config --type public >/dev/null
