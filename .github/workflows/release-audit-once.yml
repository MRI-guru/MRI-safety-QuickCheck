name: One-time Release Audit

on:
  push:
    branches:
      - beta-hardening-typecheck-20260906
    paths:
      - .github/workflows/release-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Expo Doctor
        continue-on-error: true
        run: npx expo-doctor
      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Public Expo config
        run: npx expo config --type public
