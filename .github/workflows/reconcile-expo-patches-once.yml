name: One-time Expo Patch Reconcile

on:
  push:
    branches:
      - beta-hardening-typecheck-20260906
    paths:
      - .github/workflows/reconcile-expo-patches-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta-hardening-typecheck-20260906
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Align Expo SDK patch versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.expo = '~57.0.21';
          pkg.dependencies['expo-router'] = '~57.0.20';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Typecheck
        run: npm run typecheck
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Validate public Expo config
        run: npx expo config --type public >/dev/null
      - name: Commit reconciled package files
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Expo patch versions already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Align Expo SDK patch versions'
          git push origin HEAD:beta-hardening-typecheck-20260906
