name: Build 11 RC Validation

on:
  push:
    branches:
      - build-11-rc
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact-system wrapper guard
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings "quickcheck_run_exact_system_check_v4" app; then
            echo "Build 11 must not call the v4 exact-system RPC from mobile code."
            exit 1
          fi
          grep -R --line-number --fixed-strings "quickcheck_run_exact_system_check_v5" app >/dev/null || {
            echo "Build 11 mobile code must call the v5 exact-system RPC."
            exit 1
          }

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Expo project health
        run: npx expo-doctor
